name: Update sitemaps and llms.txt
on:
  schedule:
    # 每月 1 日 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate discovery files
        run: python3 scripts/update-sitemaps.py
      - name: Commit and push if changed
        run: |
          git config user.name "doroscn"
          git config user.email "jash.zheng@gmail.com"
          git add \
            sitemap.xml \
            sitemap-pages.xml \
            sitemap-asn.xml \
            sitemap-dns.xml \
            sitemap-blog.xml \
            llms.txt \
            llms-full.txt
          if git diff --cached --quiet; then
            echo "No sitemap / llms.txt changes."
            exit 0
          fi
          git commit -m "chore: monthly refresh of sitemaps and llms.txt"
          git push
