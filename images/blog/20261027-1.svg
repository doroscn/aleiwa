  <linearGradient id="edgeFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#20a8ff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#20a8ff" stop-opacity="0.08"/>
  </linearGradient>
</defs>
