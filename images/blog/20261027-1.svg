<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Bandwidth traffic waveform converted to Bangladesh local time</title>
<desc id="desc">Actual traffic samples from the supplied CSV. Both series are plotted from the provided bandwidth data. The vertical axis has no numeric labels. Timestamps have been converted from Beijing time to Bangladesh Standard Time by subtracting two hours.</desc>
